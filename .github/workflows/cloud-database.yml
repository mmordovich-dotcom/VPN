name: Cloud database - migrate and seed
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cloud-demo-database
  cancel-in-progress: false
jobs:
  verify:
    uses: ./.github/workflows/verify.yml
  migrate:
    needs: verify
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:database
      - name: Apply saved migrations and idempotent demo seed
        run: pnpm cloud:database
        env:
          MIGRATION_DATABASE_URL: ${{ secrets.NEON_MIGRATION_DATABASE_URL }}
          NODE_ENV: production
          APP_MODE: demo
